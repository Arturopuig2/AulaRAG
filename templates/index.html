<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula - Asistente Escolar</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico?v=40">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32x32.png?v=40">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/img/apple-touch-icon.png?v=40">
    <link rel="stylesheet" href="/static/css/style.css?v=500">
    <link rel="stylesheet" href="/static/css/theory_content.css?v=500">
    <style>
        .message.assistant .bubble h1,
        .message.assistant .bubble h2,
        .message.assistant .bubble h3,
        .message.assistant .bubble h4,
        .message.assistant h1,
        .message.assistant h2,
        .message.assistant h3,
        .message.assistant h4,
        .chat-bubble-preview h1,
        .chat-bubble-preview h2,
        .chat-bubble-preview h3,
        .chat-bubble-preview h4,
        .bubble h1,
        .bubble h2,
        .bubble h3,
        .bubble h4,
        #chat-messages h1,
        #chat-messages h2,
        #chat-messages h3,
        #chat-messages h4,
        #chat-messages .bubble h1,
        #chat-messages .bubble h2,
        #chat-messages .bubble h3,
        #chat-messages .bubble h4 {
            font-size: 1.15em !important;
            font-weight: 400 !important;
            color: #f59e0b !important;
            margin: 12px 0 8px 0 !important;
            padding-bottom: 6px !important;
            border-bottom: 2px solid #f59e0b !important;
            letter-spacing: 0.01em !important;
            display: block !important;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" aria-label="Asignaturas y Cursos">
            <div class="logo-container" style="text-align: center; margin-bottom: 20px;">
                <img src="/static/img/logoChat.png" alt="Aula Logo"
                    style="max-width: 100%; height: auto; max-height: 52px;">
            </div>

            <!-- 1. Selection of Course FIRST -->
            <div class="course-selection-container" style="margin-bottom: 20px;">
                <h3 class="sidebar-section-title">Curso</h3>
                <div class="filter-group" id="group-curso" style="margin-bottom: 0;">
                    <div id="course-buttons-grid" class="course-buttons-grid"></div>
                    <select id="filter-curso" style="display: none;">
                        <option value="">Selecciona Curso...</option>
                    </select>
                </div>
            </div>

            <!-- 2. Selection of Subject SECOND -->
            <div class="subjects-selection-container" style="margin-bottom: 15px;">
                <h3 class="sidebar-section-title">Asignatura</h3>
                <nav class="subjects-nav">
                    <button class="subject-btn btn-blue active" data-subject="matematicas">
                        <span class="icon">📐</span>
                        <span class="label">Mates</span>
                    </button>
                    <button class="subject-btn btn-green" data-subject="lengua">
                        <span class="icon">📚</span>
                        <span class="label">Lengua</span>
                    </button>
                    <button class="subject-btn btn-orange" data-subject="valenciano">
                        <span class="icon">🦇</span>
                        <span class="label">Valencià</span>
                    </button>
                    <button class="subject-btn btn-yellow" data-subject="ingles">
                        <span class="icon">🇬🇧</span>
                        <span class="label">Inglés</span>
                    </button>
                </nav>
            </div>

            <!-- 3. Syllabus Filters (Bloque & Contenido) -->
            <div id="syllabus-filters" class="syllabus-filters">
                <h3 class="sidebar-section-title">Tema</h3>

                <div class="filter-group" id="group-bloque">
                    <select id="filter-bloque" disabled>
                        <option value="">Selecciona Bloque...</option>
                    </select>
                </div>

                <div class="filter-group" id="group-contenido">
                    <select id="filter-contenido" disabled>
                        <option value="">Selecciona Contenido...</option>
                    </select>
                </div>

                <button id="btn-estudiar" class="btn-estudiar" disabled>¡Vamos a repasar!</button>
                <div class="user-profile" onclick="openProfileModal()" style="cursor: pointer; transition: background 0.2s;" title="Ver mi Perfil">
                    <div class="avatar" id="user-avatar-btn">👨‍🎓</div>
                    <span id="user-display-name"
                        style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight: 700;">Cargando...</span>
                    <button id="logout-btn" title="Cerrar sesión" onclick="event.stopPropagation(); logout()"
                        style="background:none;border:none;cursor:pointer;font-size:1rem;padding:4px 6px;border-radius:8px;color:#64748b;transition:background 0.2s;">⬅️</button>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-container">
            <header class="chat-header">
                <h2 id="current-subject-title">Pizarra Digital - Matemáticas</h2>
                <div class="header-tools">
                    <a href="/admin/exercises" class="admin-btn">⚙️ Administrador</a>
                </div>
            </header>

            <div class="chat-messages" id="chat-messages">
                <!-- Welcome Message -->
                <div class="message assistant">
                    <div class="bubble" id="welcome-message">
                        ¡Hola! Soy tu chat de teoría. ¿Qué quieres repasar hoy? 😊
                    </div>
                </div>
            </div>

            <!-- Theory Content Card (hidden by default) -->
            <div id="theory-content-card" class="theory-card" style="display: none;"></div>

            <!-- Static Action Bar: MÁS FÁCIL & EJEMPLOS -->
            <div id="theory-action-bar" class="action-bar-container" style="display: none;">
                <button id="btn-easier" class="action-btn btn-easier">
                    <span class="icon">✨</span> MÁS FÁCIL
                </button>
                <button id="btn-examples" class="action-btn btn-examples">
                    <span class="icon">💡</span> EJEMPLOS
                </button>
            </div>

            <!-- Chat Footer (Input) -->
            <footer class="chat-footer" style="display: none;">
                <form id="chat-form" class="chat-input-wrapper">
                    <input type="text" id="chat-input" placeholder="Pregunta sobre la lección..." autocomplete="off">
                    <button type="submit" id="send-btn">
                        <span>Enviar</span> 🚀
                    </button>
                </form>
            </footer>
        </main>
    </div>

    <!-- PROFILE MODAL -->
    <div id="profile-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-avatar-preview">👨‍🎓</div>
                <div>
                    <h2 class="modal-title">Mi Perfil</h2>
                    <p class="modal-subtitle">Configura tus datos de alumno</p>
                </div>
                <button type="button" class="modal-close-btn" onclick="closeProfileModal()">✖</button>
            </div>
            
            <form id="profile-form" onsubmit="saveProfile(event)">
                <div class="form-group">
                    <label for="profile-name-input">Nombre del Alumno/a</label>
                    <input type="text" id="profile-name-input" class="profile-input" required placeholder="Tu nombre...">
                </div>

                <div class="form-group">
                    <label>Curso Actual (Educación Primaria)</label>
                    <div class="profile-course-grid">
                        <button type="button" class="profile-course-btn" data-grade="1" onclick="selectProfileGrade(1)">1º</button>
                        <button type="button" class="profile-course-btn" data-grade="2" onclick="selectProfileGrade(2)">2º</button>
                        <button type="button" class="profile-course-btn" data-grade="3" onclick="selectProfileGrade(3)">3º</button>
                        <button type="button" class="profile-course-btn" data-grade="4" onclick="selectProfileGrade(4)">4º</button>
                        <button type="button" class="profile-course-btn" data-grade="5" onclick="selectProfileGrade(5)">5º</button>
                        <button type="button" class="profile-course-btn" data-grade="6" onclick="selectProfileGrade(6)">6º</button>
                    </div>
                    <input type="hidden" id="profile-grade-input" value="1">
                </div>

                <div id="profile-status-msg" style="margin-bottom: 15px; font-weight: 600; font-size: 0.9rem; text-align: center; display: none;"></div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeProfileModal()">Cancelar</button>
                    <button type="submit" class="btn-save" id="btn-save-profile">💾 Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/static/js/chat.js?v=400"></script>
    <script>
        let currentUserData = { name: '', grade: 1 };

        function getCookie(name) {
            let match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            if (match) return match[2];
        }
        
        if (!getCookie('access_token')) {
            window.location.href = '/login';
        } else {
            fetch('/auth/me', {
                headers: { 'Authorization': 'Bearer ' + getCookie('access_token') }
            }).then(r => r.json()).then(data => {
                if (data.name) {
                    currentUserData = data;
                    document.getElementById('user-display-name').textContent = data.name;
                    if (data.grade) {
                        selectProfileGrade(data.grade);
                        const btn = document.querySelector(`.course-btn[data-course="${data.grade}"]`);
                        if (btn) btn.click();
                    }
                } else {
                    document.cookie = 'access_token=; path=/; max-age=0';
                    window.location.href = '/login';
                }
            }).catch(() => {
                document.cookie = 'access_token=; path=/; max-age=0';
                window.location.href = '/login';
            });
        }

        function logout() {
            document.cookie = 'access_token=; path=/; max-age=0';
            window.location.href = '/login';
        }

        function openProfileModal() {
            document.getElementById('profile-name-input').value = currentUserData.name || '';
            selectProfileGrade(currentUserData.grade || 1);
            document.getElementById('profile-status-msg').style.display = 'none';
            document.getElementById('profile-modal').style.display = 'flex';
        }

        function closeProfileModal() {
            document.getElementById('profile-modal').style.display = 'none';
        }

        function selectProfileGrade(grade) {
            document.getElementById('profile-grade-input').value = grade;
            document.querySelectorAll('.profile-course-btn').forEach(btn => {
                if (parseInt(btn.getAttribute('data-grade')) === parseInt(grade)) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        async function saveProfile(event) {
            event.preventDefault();
            const name = document.getElementById('profile-name-input').value.trim();
            const grade = parseInt(document.getElementById('profile-grade-input').value) || 1;
            const statusMsg = document.getElementById('profile-status-msg');
            const saveBtn = document.getElementById('btn-save-profile');

            if (!name) return;

            saveBtn.disabled = true;
            statusMsg.style.display = 'block';
            statusMsg.style.color = '#3b82f6';
            statusMsg.textContent = 'Guardando cambios...';

            const formData = new FormData();
            formData.append('name', name);
            formData.append('grade', grade);

            try {
                const resp = await fetch('/auth/profile', {
                    method: 'POST',
                    body: formData,
                    headers: { 'Authorization': 'Bearer ' + getCookie('access_token') }
                });
                const res = await resp.json();
                if (res.ok && res.user) {
                    currentUserData = res.user;
                    document.getElementById('user-display-name').textContent = res.user.name;
                    statusMsg.style.color = '#16a34a';
                    statusMsg.textContent = '✓ ¡Perfil actualizado correctamente!';
                    
                    const courseBtn = document.querySelector(`.course-btn[data-course="${res.user.grade}"]`);
                    if (courseBtn) courseBtn.click();

                    setTimeout(() => {
                        closeProfileModal();
                    }, 1000);
                } else {
                    statusMsg.style.color = '#dc2626';
                    statusMsg.textContent = res.error || 'Error al actualizar el perfil';
                }
            } catch (err) {
                statusMsg.style.color = '#dc2626';
                statusMsg.textContent = 'Error de conexión';
            } finally {
                saveBtn.disabled = false;
            }
        }
    </script>
</body>

</html>
